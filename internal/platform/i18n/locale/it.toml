# Prompt di collegamento / ricollegamento creator
[creator_register_info]
description = "Private-chat onboarding prompt for starting creator setup"
other = "🎙️ <b>Configura il tuo account creator</b>\n\n⚠️ <b>Solo creator</b>\nQuesti passaggi servono solo ai creator che vogliono proteggere un gruppo. Se vuoi entrare in un gruppo come abbonato, usa invece /start.\n\n➡️ <b>Step 1 di 4</b>\nCollega il tuo <b>account creator Twitch</b>.\n\n<b>Percorso di setup</b>\n1. Collega account Twitch\n2. Aggiungi il bot al gruppo\n3. Concedi al bot i permessi necessari\n4. Esegui <code>/linkgroup</code> e scegli la policy del gruppo\n\n<b>Nota privacy</b>\nImSub memorizza il tuo ID Telegram, l'account creator Twitch collegato, i token OAuth creator e le impostazioni dei gruppi gestiti per far funzionare il controllo degli accessi. Usa /reset per esportare o eliminare i dati del bot.\n\n<i>I link di autorizzazione scadono e possono essere usati una sola volta. Se il link è scaduto o è già stato usato, torna qui e usa /creator per ottenerne uno nuovo.\n\nSe il pulsante qui sotto non apre Twitch, copia il link e aprilo nel browser. Se Twitch continua a non aprirsi, prova ad aprire il link in una finestra in incognito oppure da un altro dispositivo.</i>"

[creator_reconnect_info]
description = "Private-chat prompt shown when a creator must reconnect Twitch auth"
other = "🔄 <b>Ricollega account creator</b>\n\n<b>Ricollega</b> il tuo account creator per continuare a gestire i tuoi gruppi.\n\n<b>Nota privacy</b>\nImSub memorizza il tuo ID Telegram, l'account creator Twitch collegato, i token OAuth creator e le impostazioni dei gruppi gestiti per far funzionare il controllo degli accessi. Usa /reset per esportare o eliminare i dati del bot.\n\n<i>I link di autorizzazione scadono e possono essere usati una sola volta. Se il link è scaduto o è già stato usato, torna qui e usa /creator per ottenerne uno nuovo.\n\nSe il pulsante qui sotto non apre Twitch, copia il link e aprilo nel browser. Se Twitch continua a non aprirsi, prova ad aprire il link in una finestra in incognito oppure da un altro dispositivo.</i>"

