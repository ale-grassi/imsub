[creator_register_info]
other = "🎙️ <b>Set up your creator account</b>\n\nConnect your <b>Twitch creator account</b> to set up subscribers-only Telegram groups.\n\n⚠️ <b>Creator only</b>\nThese steps are only for creators who want to protect a group.\nIf you want to join a group as a subscriber, use /start instead.\n\n<b>Get started</b>\n1. Tap <b>Connect Creator Account</b>\n2. Log in on Twitch and approve access\n3. In the group you want to protect, run <code>/linkgroup</code>. You must be an admin in that group.\n\n<i>If you have any problem, copy the link using the button below and paste it into a browser. If the problem persists, paste it into your browser's incognito mode.</i>"

