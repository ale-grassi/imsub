# Creator auth / onboarding prompts
[creator_register_info]
description = "Private-chat onboarding prompt for starting creator setup"
other = "🎙️ <b>Set up your creator account</b>\n\n⚠️ <b>Creator only</b>\nThese steps are only for creators who want to protect a group. If you want to join a group as a subscriber, use /start instead.\n\n➡️ <b>Step 1 of 4</b>\nConnect your <b>Twitch creator account</b>.\n\n<b>Setup flow</b>\n1. Link Twitch account\n2. Add the bot to the group\n3. Give the bot the required permissions\n4. Run <code>/linkgroup</code> and choose the group policy\n\n<b>Privacy notice</b>\nImSub stores your Telegram ID, linked Twitch creator account, creator OAuth tokens, and managed-group settings to operate access control. Use /reset to export or delete your bot data.\n\n<i>Authorization links expire and can only be used once. If the link has expired or was already used, come back here and use /creator to get a new one.\n\nIf the button below does not open Twitch, copy the link and open it in your browser. If Twitch still does not open, try to open the link in an incognito window or on a different device.</i>"

[creator_reconnect_info]
description = "Private-chat prompt shown when a creator must reconnect Twitch auth"
other = "🔄 <b>Reconnect Creator Account</b>\n\n<b>Reconnect</b> your creator account to continue managing your groups.\n\n<b>Privacy notice</b>\nImSub stores your Telegram ID, linked Twitch creator account, creator OAuth tokens, and managed-group settings to operate access control. Use /reset to export or delete your bot data.\n\n<i>Authorization links expire and can only be used once. If the link has expired or was already used, come back here and use /creator to get a new one.\n\nIf the button below does not open Twitch, copy the link and open it in your browser. If Twitch still does not open, try to open the link in an incognito window or on a different device.</i>"

