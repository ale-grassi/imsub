name: Main

on:
  push:
    branches:
      - main

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      fly: ${{ steps.filter.outputs.fly }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            fly:
              - 'fly.toml'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/main.yml'

  fly-config:
    name: Fly config validation
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Skip Fly config validation
        if: needs.changes.outputs.fly != 'true'
        run: echo "No Fly or deploy-related changes; skipping Fly config validation."

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: needs.changes.outputs.fly == 'true'
        with:
          version: v0.4.19

      - name: Validate Fly config
        if: needs.changes.outputs.fly == 'true'
        run: flyctl config validate --strict -c fly.toml
        env:
          FLY_ACCESS_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Vet
        run: make vet

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: make build

  unit-tests-race:
    name: Unit Tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test with race detector and coverage
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Generate coverage summary
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          go tool cover -html=coverage.out -o coverage.html
          total="$(tail -n1 coverage.txt | awk '{print $3}')"
          {
            echo "## Coverage"
            echo
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Total coverage | ${total} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.txt
            coverage.html

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Integration Tests
        run: make test-integration
        env:
          IMSUB_TEST_REDIS_URL: redis://localhost:6379/0

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
          args: --fix=false

      - name: Format check
        run: make fmt-check

  actionlint:
    name: Workflow lint
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Skip workflow lint
        if: needs.changes.outputs.workflows != 'true'
        run: echo "No workflow changes; skipping actionlint."

      - name: Lint GitHub Actions workflows
        if: needs.changes.outputs.workflows == 'true'
        uses: raven-actions/actionlint@v2

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run govulncheck
        run: make vuln

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to production
    needs: [fly-config, vet, build, unit-tests-race, integration-tests, lint, actionlint, vulncheck, gitleaks]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://imsub.fly.dev
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: v0.4.19

      - name: Deploy to Fly.io
        run: flyctl deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
